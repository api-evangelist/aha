openapi: 3.2.0
info:
  title: Aha! Integration fields API
  version: 1.0.0
  description: Complete API documentation for Aha! generated from actual test responses
  contact:
    name: Aha! Support
    url: https://www.aha.io/support
servers:
- url: https://{account-domain}.aha.io/api/v1
  description: Aha! API Server
  variables:
    account-domain:
      description: Your Aha! account domain
      default: company
security:
- OAuth2: []
- ApiKeyAuth: []
- CookieAuth: []
tags:
- name: Integration fields
paths:
  /integration_fields/{id}:
    delete:
      summary: Delete an integration field
      description: null
      tags:
      - Integration fields
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '204':
          description: No content - operation successful
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: deleteIntegrationFieldsById
      x-operation-id-source: derived
  /epics/fields/{field_name}/value/{field_value}:
    get:
      summary: List epics with an associated integration field value
      description: null
      tags:
      - Integration fields
      parameters:
      - name: field_name
        in: path
        required: true
        schema:
          type: string
        description: FieldName identifier
      - name: field_value
        in: path
        required: true
        schema:
          type: string
        description: FieldValue identifier
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: per_page
        in: query
        required: false
        schema:
          type: string
        example: '30'
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IntegrationfieldsGetResponse'
              example:
                records: []
                pagination:
                  total_records: 0
                  total_pages: 0
                  current_page: 1
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getEpicsFieldsByFieldNameValueByFieldValue
      x-operation-id-source: derived
  /features/{feature_id}/integrations/{integration_id}/fields/{field_name}:
    get:
      summary: Get a specific integration field value
      description: null
      tags:
      - Integration fields
      parameters:
      - name: feature_id
        in: path
        required: true
        schema:
          type: string
        description: FeatureId identifier
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
        description: IntegrationId identifier
      - name: field_name
        in: path
        required: true
        schema:
          type: string
        description: FieldName identifier
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IntegrationfieldsGetResponse'
              example:
                integration_field:
                  id: '728894778'
                  name: key
                  value: JRA-123
                  integration_id: 204584239
                  service_name: jira
                  created_at: '2019-01-01T00:00:00.000Z'
                  integratable:
                    url: https://company.aha.io/features/PRJ1-1
                    resource: https://company.aha.io/api/v1/features/PRJ1-1
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getFeaturesByFeatureIdIntegrationsByIntegrationIdFieldsByFieldName
      x-operation-id-source: derived
