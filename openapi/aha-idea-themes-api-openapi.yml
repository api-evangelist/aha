openapi: 3.2.0
info:
  title: Aha! Idea themes API
  version: 1.0.0
  description: Complete API documentation for Aha! generated from actual test responses
  contact:
    name: Aha! Support
    url: https://www.aha.io/support
servers:
- url: https://{account-domain}.aha.io/api/v1
  description: Aha! API Server
  variables:
    account-domain:
      description: Your Aha! account domain
      default: company
security:
- OAuth2: []
- ApiKeyAuth: []
- CookieAuth: []
tags:
- name: Idea themes
paths:
  /idea_themes/{id}:
    delete:
      summary: Delete an idea theme
      description: null
      tags:
      - Idea themes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '204':
          description: No content - operation successful
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: deleteIdeaThemesById
      x-operation-id-source: derived
    get:
      summary: Get a specific idea theme
      description: null
      tags:
      - Idea themes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IdeathemesGetResponse'
              example:
                idea_theme:
                  id: '6776881149491590316'
                  reference_num: PRJ1-I-101
                  name: Performance
                  created_at: '2019-01-01T00:00:00.000Z'
                  description: null
                  product:
                    id: '131414752'
                    reference_prefix: PRJ1
                    name: Project 1
                    product_line: false
                    created_at: '2019-01-01T00:00:00.000Z'
                    url: https://company.aha.io/projects/PRJ1
                    workspace_type: product_workspace
                  ideas: []
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getIdeaThemesById
      x-operation-id-source: derived
    put:
      summary: Update an idea theme
      description: null
      tags:
      - Idea themes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IdeathemesPutResponse'
              example:
                idea_theme:
                  id: '6776881149497103673'
                  reference_num: PRJ1-I-102
                  name: Updated theme
                  created_at: '2019-01-01T00:00:00.000Z'
                  description: null
                  product:
                    id: '131414752'
                    reference_prefix: PRJ1
                    name: Project 1
                    product_line: false
                    created_at: '2019-01-01T00:00:00.000Z'
                    url: https://company.aha.io/projects/PRJ1
                    workspace_type: product_workspace
                  ideas: []
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeathemesPostRequest'
            example:
              idea_theme:
                name: Updated theme
      operationId: putIdeaThemesById
      x-operation-id-source: derived
  /idea_themes:
    get:
      summary: List idea themes
      description: null
      tags:
      - Idea themes
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: per_page
        in: query
        required: false
        schema:
          type: string
        example: '30'
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IdeathemesGetResponse'
              example:
                idea_themes:
                - id: '6776881149495115194'
                  reference_num: PRJ1-I-100
                  name: Performance
                  created_at: '2019-01-01T00:00:00.000Z'
                pagination:
                  total_records: 1
                  total_pages: 1
                  current_page: 1
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getIdeaThemes
      x-operation-id-source: derived
    post:
      summary: Create an idea theme
      description: null
      tags:
      - Idea themes
      parameters: []
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
