                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IdeathemesPostResponse'
              example:
                idea_theme:
                  id: '6776881149491199918'
                  reference_num: PRJ1-T-1
                  name: New theme
                  created_at: '2019-01-01T00:00:00.000Z'
                  description:
                    id: '6776881149496975329'
                    body: <p>Theme description</p>
                    notable_id: '6776881149491199918'
                    notable_type: Ideas::IdeaTheme
                    editor_version: 2
                    created_at: '2019-01-01T00:00:00.000Z'
                    updated_at: '2019-01-01T00:00:00.000Z'
                    attachments: []
                  product:
                    id: '131414752'
                    reference_prefix: PRJ1
                    name: Project 1
                    product_line: false
                    created_at: '2019-01-01T00:00:00.000Z'
                    url: https://company.aha.io/projects/PRJ1
                    workspace_type: product_workspace
                  ideas: []
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeathemesPostRequest'
            example:
              product_id: PRJ1
              idea_theme:
                name: New theme
                description_attributes:
                  body: <p>Theme description</p>
      operationId: postIdeaThemes
      x-operation-id-source: derived
