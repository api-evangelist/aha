                    url: https://company.aha.io/ideas/idea_organizations/ACCOUNT-O-456
                    resource: https://company.aha.io/api/v1/idea_organizations/ACCOUNT-O-456
                  custom_fields: []
                  integration_fields: []
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeausersPostRequest'
            example:
              idea_user:
                discovery_group_ids: []
      operationId: putIdeaUsersById
      x-operation-id-source: derived
