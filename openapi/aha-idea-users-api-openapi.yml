      description: null
      tags:
      - Idea users
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IdeausersPutResponse'
              example:
                idea_user:
                  id: '1056507375'
                  name: John Long
                  email: john@long.com
                  created_at: '2019-01-01T00:00:00.000Z'
                  idea_organizations:
                  - id: '138732915'
                    name: Acme
                    created_at: '2019-01-01T00:00:00.000Z'
                    url: https://company.aha.io/ideas/idea_organizations/ACCOUNT-O-123
