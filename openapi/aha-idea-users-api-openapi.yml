    delete:
      summary: Delete an idea user
      description: null
      tags:
      - Idea users
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '204':
          description: No content - operation successful
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: deleteIdeaUsersById
      x-operation-id-source: derived
    get:
      summary: Get a specific idea user
      description: null
      tags:
      - Idea users
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      - name: fields
        in: query
        required: false
        schema:
          type: string
        example: email,phone
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IdeausersGetResponse'
              example:
                idea_user:
                  id: '1056507375'
                  name: John Long
                  email: john@long.com
                  phone: null
                  idea_organizations: []
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getIdeaUsersById
      x-operation-id-source: derived
    put:
