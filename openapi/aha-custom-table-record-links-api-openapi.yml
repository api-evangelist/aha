openapi: 3.2.0
info:
  title: Aha! Custom table record links API
  version: 1.0.0
  description: Complete API documentation for Aha! generated from actual test responses
  contact:
    name: Aha! Support
    url: https://www.aha.io/support
servers:
- url: https://{account-domain}.aha.io/api/v1
  description: Aha! API Server
  variables:
    account-domain:
      description: Your Aha! account domain
      default: company
security:
- OAuth2: []
- ApiKeyAuth: []
- CookieAuth: []
tags:
- name: Custom table record links
paths:
  /custom_object_records/{id}:
    put:
      summary: Link custom table records to another custom table record
      description: 'Resources that can be linked to records from a custom table (called custom objects in the API) can be manipulated in a bulk ID-list format.

        To use custom table record links you must first add a many-to-many custom field definition to the resource.

        When you pass the IDs of custom table records to link to the feature, the existing list of links will be replaced.


        Examples of linking custom objects to resources with a many-to-many `customer` field:


        - Products

        - Releases

        - Features

        - Ideas

        - Initiatives

        - Goals

        - Organizations


        **Custom tables are an Enterprise+ exclusive feature.**'
      tags:
      - Custom table record links
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomtablerecordsPutResponse'
              example:
                custom_object_record:
                  id: '640362830'
                  product_id: '131414752'
                  key: customers
                  created_at: '2019-01-01T00:00:00.000Z'
                  updated_at: '2019-01-01T00:00:00.000Z'
                  custom_fields:
                  - id: 262515157
                    key: name
                    name: Name
                    updatedAt: '2019-01-01T00:00:00Z'
                    type: string
                    value: Acme parent corp
                  - id: 883926222
                    key: website
                    name: Website
                    updatedAt: '2019-01-01T00:00:00Z'
                    type: url
                    value: www.acmeparent.com
                  custom_object_links: []
                  linked_records:
                  - key: customers
                    name: Customers
                    record_type: Ideas::Idea
                    record_id: 162120796
                  - key: revenue
                    name: Revenue
                    record_type: Ideas::Idea
                    record_id: 58056975
                  - key: submitters
                    name: Submitters
                    record_type: Ideas::Idea
                    record_id: 58056975
                  created_by_user:
                    id: '1020675218'
                    name: Mary Humpty
                    email: no-reply@aha.io
                    created_at: '2019-01-01T00:00:00.000Z'
                    updated_at: '2019-01-01T00:00:00.000Z'
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomtablerecordlinksPostRequest'
            example:
              custom_object_record:
                custom_object_links:
                  custom_table_name_submitters:
                  - 136661093
      operationId: putCustomObjectRecordsById
      x-operation-id-source: derived
  /features/{id}:
