                      name: Account 1
                      domain: company
                      logo: null
                      alt_logo: null
                      enabled: true
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getMe
      x-operation-id-source: derived
