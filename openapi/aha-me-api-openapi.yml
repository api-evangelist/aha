                example: pending
              created_at:
                type: string
                example: '2019-01-01T00:00:00.000Z'
            example:
              id: '6776881149494751081'
              name: Review first widget
              due_date: null
              status: pending
              created_at: '2019-01-01T00:00:00.000Z'
          example:
          - id: '6776881149494751081'
            name: Review first widget
            due_date: null
            status: pending
            created_at: '2019-01-01T00:00:00.000Z'
        pagination:
          type: object
          properties:
            total_records:
              type: integer
              example: 1
            total_pages:
              type: integer
              example: 1
            current_page:
              type: integer
              example: 1
          example:
            total_records: 1
            total_pages: 1
            current_page: 1
      example:
        tasks:
        - id: '6776881149494751081'
          name: Review first widget
          due_date: null
          status: pending
          created_at: '2019-01-01T00:00:00.000Z'
        pagination:
          total_records: 1
          total_pages: 1
          current_page: 1
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication with bearer tokens
      flows:
        authorizationCode:
          authorizationUrl: https://{account-domain}.aha.io/oauth/authorize
          tokenUrl: https://{account-domain}.aha.io/oauth/token
          scopes: {}
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key authentication using Bearer token in Authorization header. Generate API keys at https://secure.aha.io/settings/api_keys
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Cookie-based authentication for web browser integration
