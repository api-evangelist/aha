        must be a top-level comment on the same resource; replies to replies are not supported.'
      tags:
      - Comments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      - name: fields
        in: query
        required: false
        schema:
          type: string
        example: body,reactions
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CommentsGetResponse'
              example:
                comment:
                  id: '781701978'
                  body: Comment on feature
