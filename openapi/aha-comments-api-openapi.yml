openapi: 3.2.0
info:
  title: Aha! Comments API
  version: 1.0.0
  description: Complete API documentation for Aha! generated from actual test responses
  contact:
    name: Aha! Support
    url: https://www.aha.io/support
servers:
- url: https://{account-domain}.aha.io/api/v1
  description: Aha! API Server
  variables:
    account-domain:
      description: Your Aha! account domain
      default: company
security:
- OAuth2: []
- ApiKeyAuth: []
- CookieAuth: []
tags:
- name: Comments
paths:
  /comments/{id}:
    delete:
      summary: Delete a comment
      description: 'Comments can be added to and listed as a sub-resource on any resource that supports them.

        These resources support comments:


        - Features

        - Epics

        - Requirements

        - Ideas

        - Initiatives

        - Goals

        - Releases

        - Release phases

        - To-dos


        They can be listed product-wide,

        or retrieved from anywhere in the system using the root comments resource.


        To reply to a comment, specify the parent_comment_id when creating a comment. The parent

        must be a top-level comment on the same resource; replies to replies are not supported.'
      tags:
      - Comments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '204':
          description: No content - operation successful
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: deleteCommentsById
      x-operation-id-source: derived
    get:
      summary: Get a specific comment
      description: 'Comments can be added to and listed as a sub-resource on any resource that supports them.

        These resources support comments:


