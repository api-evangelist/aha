  /epics/{epic_id}/features:
    get:
      summary: List features in an epic
      description: 'Features belong to releases.

        This means that if you want to

        create one then

        you must scope it to a release.


        You can return a result set which is unfiltered, or filter by

        release

        , product

        , or epic.

        All these means of listing features can be further filtered by specific criteria like name, modification date, tag, or assignee.


        Once you have the id of a specific feature, you can

        inspect,

        modify,

        or

        delete

        them on the root features resource.'
      tags:
      - Features
      parameters:
      - name: epic_id
        in: path
        required: true
        schema:
          type: string
        description: EpicId identifier
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: per_page
        in: query
        required: false
        schema:
          type: string
        example: '30'
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/FeaturesGetResponse'
              example:
                features:
                - id: '1007868956'
                  name: Feature 1
                  reference_num: PRJ1-1
                  created_at: '2019-01-01T00:00:00.000Z'
                  product_id: '131414752'
                  url: https://company.aha.io/features/PRJ1-1
                  resource: https://company.aha.io/api/v1/features/PRJ1-1
                pagination:
                  total_records: 1
                  total_pages: 1
                  current_page: 1
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getEpicsByEpicIdFeatures
      x-operation-id-source: derived
  /features:
    get:
      summary: List features
      description: Retrieves a paginated list of all features across the account with optional filtering and field selection
      tags:
      - Features
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: per_page
        in: query
        required: false
        schema:
          type: string
        example: '30'
      - name: custom_fields
        in: query
        required: false
        schema:
          type: string
        example:
          expected_completion_date: '2019-01-01'
      - name: fields
        in: query
        required: false
        schema:
          type: string
        example: reference_num
      - name: workflow_status
        in: query
        required: false
        schema:
          type: string
        example: New
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/FeaturesGetResponse'
              example:
                features:
                - id: '229579240'
                  reference_num: PRJ3-1
