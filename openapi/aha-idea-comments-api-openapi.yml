openapi: 3.2.0
info:
  title: Aha! Idea comments API
  version: 1.0.0
  description: Complete API documentation for Aha! generated from actual test responses
  contact:
    name: Aha! Support
    url: https://www.aha.io/support
servers:
- url: https://{account-domain}.aha.io/api/v1
  description: Aha! API Server
  variables:
    account-domain:
      description: Your Aha! account domain
      default: company
security:
- OAuth2: []
- ApiKeyAuth: []
- CookieAuth: []
tags:
- name: Idea comments
paths:
  /ideas/{idea_id}/idea_comments/{id}:
    delete:
      summary: Delete an idea comment
      description: 'Idea comments can appear in ideas portals.

        To reply to an idea_comment, specify the parent_idea_comment_id. Its visibility

        will come from its parent idea comment and cannot be overridden.'
      tags:
      - Idea comments
      parameters:
      - name: idea_id
        in: path
        required: true
        schema:
          type: string
        description: IdeaId identifier
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id identifier
      responses:
        '204':
          description: No content - operation successful
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: deleteIdeasByIdeaIdIdeaCommentsById
      x-operation-id-source: derived
  /ideas/{idea_id}/idea_comments:
    get:
      summary: List idea comments for an idea
      description: 'Idea comments can appear in ideas portals.

        To reply to an idea_comment, specify the parent_idea_comment_id. Its visibility

        will come from its parent idea comment and cannot be overridden.'
      tags:
      - Idea comments
      parameters:
      - name: idea_id
        in: path
        required: true
        schema:
          type: string
        description: IdeaId identifier
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: per_page
        in: query
        required: false
        schema:
          type: string
        example: '30'
      - name: fields
        in: query
        required: false
        schema:
          type: string
        example: body,visibility
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IdeacommentsGetResponse'
              example:
                idea_comments:
                - id: '622085811'
                  idea_id: '58056975'
                  body: This is a great idea! We'll get started right away.
                  visibility: Visible to all ideas portal users
                  attachments: []
                - id: '6776881149489066045'
                  idea_id: '58056975'
                  body: A reply to a comment
                  visibility: Visible to all ideas portal users
                  attachments: []
                - id: '6776881149497829976'
                  idea_id: '58056975'
                  body: Just us employees
                  visibility: Visible to creator and employees
                  attachments: []
                pagination:
                  total_records: 3
                  total_pages: 1
                  current_page: 1
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getIdeasByIdeaIdIdeaComments
      x-operation-id-source: derived
    post:
      summary: Create an idea comment created by an Aha! user (specified by id)
      description: 'Idea comments can appear in ideas portals.

        To reply to an idea_comment, specify the parent_idea_comment_id. Its visibility

        will come from its parent idea comment and cannot be overridden.'
      tags:
      - Idea comments
      parameters:
      - name: idea_id
        in: path
        required: true
        schema:
          type: string
        description: IdeaId identifier
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/IdeacommentsPostResponse'
              example:
                idea_comment:
                  id: '6776881149486308366'
                  idea_id: '58056975'
                  body: <p>This is the comment body.</p>
                  updated_at: '2019-01-01T00:00:00.000Z'
                  created_at: '2019-01-01T00:00:00.000Z'
                  visibility: Visible to creator and employees
                  parent_idea_comment_id: null
                  idea_commenter_user:
                    id: '1020675218'
                    name: Mary Humpty
                    email: no-reply@aha.io
                    created_at: '2019-01-01T00:00:00.000Z'
                    updated_at: '2019-01-01T00:00:00.000Z'
                  idea:
                    id: '58056975'
                    name: Idea 1
                    reference_num: PRJ1-I-1
                    created_at: '2019-01-01T00:00:00.000Z'
                    updated_at: '2019-01-01T00:00:00.000Z'
                    workflow_status:
                      id: '3259216'
                      name: New
                      position: 1
                      complete: false
                      color: '#dce7c6'
                      workflow_status_category: null
                    description:
                      id: '103757394'
                      body: Description of idea 1
                      notable_id: '58056975'
                      notable_type: Ideas::Idea
                      editor_version: 1
                      created_at: '2019-01-01T00:00:00.000Z'
                      updated_at: '2019-01-01T00:00:00.000Z'
                      attachments: []
                    url: https://company.aha.io/ideas/ideas/PRJ1-I-1
                    resource: https://company.aha.io/api/v1/ideas/PRJ1-I-1
                  attachments: []
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeacommentsPostRequest'
            example:
              idea_comment:
                idea_id: PRJ1-I-1
                user:
                  id: 689956296
                body: <p>This is the comment body.</p>
      operationId: postIdeasByIdeaIdIdeaComments
      x-operation-id-source: derived
  /idea_comments/{id}:
    put:
      summary: Mark an idea comment as spam
      description: 'Idea comments can appear in ideas portals.

        To reply to an idea_comment, specify the parent_idea_comment_id. Its visibility

