openapi: 3.2.0
info:
  title: Aha! Webhooks API
  version: 1.0.0
  description: Complete API documentation for Aha! generated from actual test responses
  contact:
    name: Aha! Support
    url: https://www.aha.io/support
servers:
- url: https://{account-domain}.aha.io/api/v1
  description: Aha! API Server
  variables:
    account-domain:
      description: Your Aha! account domain
      default: company
security:
- OAuth2: []
- ApiKeyAuth: []
- CookieAuth: []
tags:
- name: Webhooks
paths:
  /webhooks/{token}:
    get:
      summary: Validate webhook endpoint
      description: 'This endpoint allows integration services to validate that the webhook URL

        is accessible and properly configured without triggering actual webhook processing.

        Useful for testing webhook connectivity during integration setup.'
      tags:
      - Webhooks
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Token identifier
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: text/plain; charset=utf-8
              schema:
                type: string
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: getWebhooksByToken
      x-operation-id-source: derived
    post:
      summary: Handle Asana resthook confirmation
      description: 'Asana and other services implementing the Resthooks specification send

        a confirmation request with an X-Hook-Secret header when setting up webhooks.

        Aha! responds with the same secret to confirm the webhook endpoint is valid.'
      tags:
      - Webhooks
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Token identifier
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
      operationId: postWebhooksByToken
      x-operation-id-source: derived
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication with bearer tokens
      flows:
        authorizationCode:
          authorizationUrl: https://{account-domain}.aha.io/oauth/authorize
          tokenUrl: https://{account-domain}.aha.io/oauth/token
          scopes: {}
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key authentication using Bearer token in Authorization header. Generate API keys at https://secure.aha.io/settings/api_keys
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Cookie-based authentication for web browser integration
