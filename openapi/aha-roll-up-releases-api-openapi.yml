                  created_at: '2019-01-01T00:00:00.000Z'
                  start_date: '2019-01-01'
                  release_date: '2019-01-01'
                  url: https://company.aha.io/master_releases/PL1-R-100
                  resource: https://company.aha.io/api/v1/releases/PL1-R-100
                pagination:
                  total_records: 2
                  total_pages: 1
                  current_page: 1
