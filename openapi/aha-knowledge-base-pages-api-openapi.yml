paths:
  /knowledge_bases/{knowledge_base_id}/pages:
    get:
      summary: List published documents for a knowledge base
      description: Knowledge base pages are the published versions of pages that are part of a knowledge base. A knowledge base must be enabled in order to access its pages.
      tags:
      - Knowledge base pages
      parameters:
      - name: knowledge_base_id
        in: path
        required: true
        schema:
          type: string
        description: KnowledgeBaseId identifier
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: per_page
        in: query
        required: false
        schema:
          type: string
        example: '30'
      - name: q
        in: query
        required: false
        schema:
          type: string
        example: first
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Type:
              description: application/json; charset=utf-8
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/KnowledgebasepagesGetResponse'
              example:
                pages:
                - id: '934552841'
                  name: Knowledge only parent note
                  title: KB-N-1 Knowledge only parent note
                  document_title: Knowledge only parent note | Aha!
                  updated_at: '2019-01-01T00:00:00.000Z'
                  emoji_value: null
                  document_type: 10
                  document_type_name: note
                  type_name: note
                  position: 100000
                  created_at: '2019-01-01T00:00:00.000Z'
                  location: null
                  url: https://knowledge-company.aha.site/kb/knowledge-base-standalone/knowledge-only-parent-note~934552841
                  knowledge_base_id: '701841993'
                  publishing_status: Published
                  parent_id: null
                  description:
                    id: '25224705'
                    body: Body of first knowledge only note
                    notable_id: '934552841'
                    notable_type: Page
                    editor_version: 1
                    created_at: '2019-01-01T00:00:00.000Z'
                    updated_at: '2019-01-01T00:00:00.000Z'
                    attachments: []
                  collections: []
                  custom_fields: []
                pagination:
                  total_records: 1
                  total_pages: 1
                  current_page: 1
      security:
      - OAuth2: []
      - ApiKeyAuth: []
      - CookieAuth: []
